name: CI Verification

on:
  push:
    branches:
      - main
      - develop
      - 'feat/**'
      - 'fix/**'
      - 'refactor/**'
      - 'test/**'
      - 'chore/**'
  pull_request:
    branches:
      - main
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Analyze, Test & Android Unit Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Static analysis (fatal infos)
        run: flutter analyze --fatal-infos

      - name: Run Flutter unit & widget tests
        run: flutter test

      - name: Grant Gradle wrapper execute permission
        run: chmod +x android/gradlew

      - name: Run Android native unit & security tests
        run: ./android/gradlew -p android :app:testDebugUnitTest
